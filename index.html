<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>still - Gold Trading Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e11;
            color: #eaecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .trade-card {
            background: #181a20;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2b313a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b313a;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .symbol {
            font-size: 20px;
            font-weight: 700;
            color: #f0b90b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(240, 185, 11, 0.15);
            color: #f0b90b;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .up { color: #0ecb81 !important; }
        .down { color: #f6465d !important; }
        .bg-up { background: rgba(14, 203, 129, 0.12); }
        .bg-down { background: rgba(246, 70, 93, 0.12); }

        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .main-price {
            font-size: 30px;
            font-weight: 700;
        }

        .change-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0b0e11;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2b313a;
        }

        .stat-label {
            font-size: 11px;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 17px;
            font-weight: 700;
        }

        .trading-buttons {
            display: flex;
            gap: 10px;
        }

        .trade-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .buy-btn {
            background-color: #0ecb81;
            color: #000;
        }

        .sell-btn {
            background-color: #f6465d;
            color: #fff;
        }

        .footer-time {
            font-size: 11px;
            color: #848e9c;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="trade-card">
        <div class="header">
            <div class="symbol">
                GOLD / INR <span class="badge">STILL</span>
            </div>
            <div style="font-size: 12px; color: #848e9c;">10 Grams</div>
        </div>

        <!-- 10 Gram Live Main Rate -->
        <div class="price-section">
            <div id="live-price" class="main-price up">₹14,850.00</div>
            <div id="price-change" class="change-badge bg-up up">+0.00% ▲</div>
        </div>

        <!-- BUY / SELL Rates for 10G & 1G -->
        <div class="grid-stats">
            <div class="stat-box">
                <div class="stat-label">BUY RATE (10G)</div>
                <div id="buy-10g" class="stat-value up">₹14,850</div>
                <div id="buy-1g" class="stat-label" style="margin-top:4px;">₹1,485 / 1g</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">SELL RATE (10G)</div>
                <div id="sell-10g" class="stat-value down">₹14,404.50</div>
                <div id="sell-1g" class="stat-label" style="margin-top:4px;">₹1,440.45 / 1g</div>
            </div>
        </div>

        <div class="trading-buttons">
            <button class="trade-btn buy-btn">BUY</button>
            <button class="trade-btn sell-btn">SELL</button>
        </div>

        <div class="footer-time">
            Auto Updating (1.2h) | Last: <span id="updated-time">Loading...</span>
        </div>
    </div>

    <script>
        let previousPrice = 14850;

        async function updateTradeData() {
            try {
                const response = await fetch('./gold_data.json?cache_bypass=' + new Date().getTime());
                const data = await response.json();

                const buy10g = data.buy_price_10g || 14850;
                const sell10g = data.sell_price_10g || (buy10g * 0.97);
                const buy1g = data.buy_price_per_gram || (buy10g / 10);
                const sell1g = data.sell_price_per_gram || (sell10g / 10);

                const livePriceEl = document.getElementById('live-price');
                const priceChangeEl = document.getElementById('price-change');

                // Up / Down Logic
                const diff = buy10g - previousPrice;
                const percentChange = ((diff / previousPrice) * 100).toFixed(2);

                if (diff >= 0) {
                    livePriceEl.className = 'main-price up';
                    priceChangeEl.className = 'change-badge bg-up up';
                    priceChangeEl.innerText = `+${percentChange}% ▲`;
                } else {
                    livePriceEl.className = 'main-price down';
                    priceChangeEl.className = 'change-badge bg-down down';
                    priceChangeEl.innerText = `${percentChange}% ▼`;
                }

                livePriceEl.innerText = `₹${buy10g.toLocaleString('en-IN')}`;
                document.getElementById('buy-10g').innerText = `₹${buy10g.toLocaleString('en-IN')}`;
                document.getElementById('sell-10g').innerText = `₹${sell10g.toLocaleString('en-IN')}`;
                document.getElementById('buy-1g').innerText = `₹${buy1g} / 1g`;
                document.getElementById('sell-1g').innerText = `₹${sell1g} / 1g`;
                document.getElementById('updated-time').innerText = data.last_updated;

                previousPrice = buy10g;

            } catch (error) {
                console.error("Data error:", error);
            }
        }

        updateTradeData();
    </script>
</body>
</html>
