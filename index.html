<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>still - Gold Trading & Chart Dashboard</title>
    <!-- Chart.js Library for Trading Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e11;
            color: #eaecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: #181a20;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2b313a;
        }

        .auth-title {
            font-size: 22px;
            color: #f0b90b;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #0b0e11;
            border: 1px solid #2b313a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: #f0b90b;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        .auth-toggle {
            text-align: center;
            font-size: 12px;
            color: #848e9c;
            margin-top: 12px;
            cursor: pointer;
        }

        .dashboard, .admin-panel { display: none; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b313a;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .wallet-box {
            background: #0b0e11;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2b313a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .add-funds-btn {
            background: #0ecb81;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .symbol { font-size: 16px; font-weight: 700; color: #f0b90b; }
        .up { color: #0ecb81 !important; }
        .down { color: #f6465d !important; }

        /* Trading Chart Container */
        .chart-container {
            background: #0b0e11;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #2b313a;
            margin-bottom: 14px;
            position: relative;
        }

        .chart-overlay-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(14, 203, 129, 0.2);
            color: #0ecb81;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
            font-weight: 700;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-box {
            background: #0b0e11;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2b313a;
        }

        .stat-label { font-size: 10px; color: #848e9c; }
        .stat-value { font-size: 15px; font-weight: 700; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #181a20;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #2b313a;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Auth Screen -->
        <div id="auth-box">
            <h2 id="auth-title" class="auth-title">STiLL Gold Trading</h2>
            
            <div id="name-field" class="input-group">
                <label>Full Name</label>
                <input type="text" id="user-name" placeholder="Apna Naam Enter Karein">
            </div>

            <div class="input-group">
                <label>Phone Number / Admin ID</label>
                <input type="tel" id="user-phone" placeholder="Phone Number ya Admin ID">
            </div>

            <div class="input-group">
                <label>4-Digit PIN (Numbers Only)</label>
                <input type="password" id="user-pin" maxlength="4" placeholder="e.g. 1234">
            </div>

            <button class="btn-main" onclick="handleAuth()">Submit</button>
            <div class="auth-toggle" onclick="toggleAuthMode()">
                <span id="toggle-text">Pehle se Account hai? Login Karein</span>
            </div>
        </div>

        <!-- Main User Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="header">
                <div>
                    <div class="symbol">GOLD / INR <span style="font-size:10px; color:#848e9c;">(10G)</span></div>
                    <div style="font-size: 12px; color: #848e9c;">User: <span id="display-username" style="color:#fff;">-</span></div>
                </div>
                <button style="background:none; border:none; color:#f6465d; cursor:pointer;" onclick="logout()">Logout</button>
            </div>

            <div class="wallet-box">
                <div>
                    <div style="font-size: 10px; color: #848e9c;">WALLET BALANCE</div>
                    <div id="wallet-balance" style="font-size: 18px; font-weight: 700; color:#fff;">₹0.00</div>
                </div>
                <button class="add-funds-btn" onclick="openPaymentModal()">+ ADD FUNDS</button>
            </div>

            <!-- Trading Chart Area (Like Image) -->
            <div class="chart-container">
                <span class="chart-overlay-badge">BUY SIGNAL ▲ ENTRY: 14,850</span>
                <canvas id="tradingChart" height="180"></canvas>
            </div>

            <div class="grid-stats">
                <div class="stat-box">
                    <div class="stat-label">BUY RATE (10G)</div>
                    <div id="buy-10g" class="stat-value up">₹14,850</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">SELL RATE (10G)</div>
                    <div id="sell-10g" class="stat-value down">₹14,404.50</div>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="btn-main" style="background:#0ecb81;" onclick="alert('Insufficient Balance for Trade')">BUY GOLD</button>
                <button class="btn-main" style="background:#f6465d; color:#fff;" onclick="alert('No Gold available to Sell')">SELL GOLD</button>
            </div>
        </div>

        <!-- Admin Control Panel -->
        <div id="admin-panel" class="admin-panel">
            <div class="header">
                <div class="symbol">ADMIN CONTROL</div>
                <button style="background:none; border:none; color:#f6465d; cursor:pointer;" onclick="logout()">Logout</button>
            </div>

            <div class="input-group">
                <label>Set 10G Buy Rate (INR)</label>
                <input type="number" id="admin-buy-rate" value="14850">
            </div>

            <div class="input-group">
                <label>Set 24H High Rate</label>
                <input type="number" id="admin-high-rate" value="14900">
            </div>

            <div class="input-group">
                <label>Set 24H Low Rate</label>
                <input type="number" id="admin-low-rate" value="14800">
            </div>

            <button class="btn-main" onclick="saveAdminSettings()">Save Rates</button>
        </div>

    </div>

    <!-- Payment Modal -->
    <div id="pay-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#f0b90b; margin-bottom:10px;">Add Money via UPI</h3>
            <p style="font-size:12px; color:#848e9c; margin-bottom:12px;">UPI ID: <b style="color:#fff;">laxmihi@ptyes</b></p>
            
            <div class="input-group">
                <input type="number" id="add-amount" placeholder="Enter Amount (₹)">
            </div>

            <button class="btn-main" style="background:#0ecb81;" onclick="redirectToUPI()">Pay Now (PhonePe/Paytm)</button>
            <button class="btn-main" style="background:#2b313a; color:#fff; margin-top:5px;" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>

    <script>
        const ADMIN_ID = "admin";
        const ADMIN_PIN = "9999";
        const UPI_ID = "laxmihi@ptyes";

        let isLoginMode = false;
        let chartInstance = null;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Login to STiLL' : 'Create STiLL Account';
            document.getElementById('name-field').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('toggle-text').innerText = isLoginMode ? 'Naya Account Banana hai? Register Karein' : 'Pehle se Account hai? Login Karein';
        }

        function handleAuth() {
            const phone = document.getElementById('user-phone').value.trim();
            const pin = document.getElementById('user-pin').value.trim();

            if (phone === ADMIN_ID && pin === ADMIN_PIN) {
                localStorage.setItem('still_logged_in', 'admin');
                loadAdminPanel();
                return;
            }

            if (pin.length !== 4 || isNaN(pin)) {
                alert('4-Digit ka Numeric PIN Enter karein!');
                return;
            }

            if (!isLoginMode) {
                const name = document.getElementById('user-name').value.trim();
                if (!name) { alert('Naam Enter Karein!'); return; }
                localStorage.setItem('still_user_' + phone, JSON.stringify({ name, phone, pin, balance: 0 }));
                alert('Account Ban gaya! Login karein.');
                toggleAuthMode();
            } else {
                const userData = JSON.parse(localStorage.getItem('still_user_' + phone));
                if (userData && userData.pin === pin) {
                    localStorage.setItem('still_logged_in', phone);
                    loadDashboard();
                } else {
                    alert('Galat Phone Number ya PIN!');
                }
            }
        }

        function loadDashboard() {
            const activePhone = localStorage.getItem('still_logged_in');
            if (!activePhone) return;

            const userData = JSON.parse(localStorage.getItem('still_user_' + activePhone));
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('display-username').innerText = userData.name;
            document.getElementById('wallet-balance').innerText = `₹${userData.balance.toFixed(2)}`;
            
            initTradingChart();
            fetchRates();
        }

        function loadAdminPanel() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        }

        function saveAdminSettings() {
            const buyRate = parseFloat(document.getElementById('admin-buy-rate').value);
            const highRate = parseFloat(document.getElementById('admin-high-rate').value);
            const lowRate = parseFloat(document.getElementById('admin-low-rate').value);

            localStorage.setItem('still_custom_rates', JSON.stringify({
                buy_price_10g: buyRate,
                sell_price_10g: (buyRate * 0.97).toFixed(2),
                high_rate: highRate,
                low_rate: lowRate
            }));
            alert('Settings Saved!');
        }

        function logout() {
            localStorage.removeItem('still_logged_in');
            location.reload();
        }

        function openPaymentModal() { document.getElementById('pay-modal').style.display = 'flex'; }
        function closePaymentModal() { document.getElementById('pay-modal').style.display = 'none'; }

        function redirectToUPI() {
            const amount = parseFloat(document.getElementById('add-amount').value);
            if (isNaN(amount) || amount <= 0) { alert('Valid amount enter karein!'); return; }
            window.location.href = `upi://pay?pa=${UPI_ID}&pn=STiLL_Trading&am=${amount}&cu=INR`;
            closePaymentModal();
        }

        /* TradingView Style Graph Implementation */
        function initTradingChart() {
            const ctx = document.getElementById('tradingChart').getContext('2d');
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['10:00', '11:12', '12:24', '13:36', '14:48', '16:00'],
                    datasets: [{
                        label: 'Gold Price (INR)',
                        data: [14800, 14820, 14790, 14830, 14810, 14850],
                        borderColor: '#0ecb81',
                        borderWidth: 2,
                        backgroundColor: 'rgba(14, 203, 129, 0.08)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#0ecb81',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#2b313a' }, ticks: { color: '#848e9c', font: { size: 9 } } },
                        y: { grid: { color: '#2b313a' }, ticks: { color: '#848e9c', font: { size: 9 } } }
                    }
                }
            });
        }

        async function fetchRates() {
            let buy10g = 14850;
            const savedAdminData = localStorage.getItem('still_custom_rates');
            if (savedAdminData) {
                const parsed = JSON.parse(savedAdminData);
                buy10g = parsed.buy_price_10g;
            }

            document.getElementById('buy-10g').innerText = `₹${buy10g.toLocaleString('en-IN')}`;
            document.getElementById('sell-10g').innerText = `₹${(buy10g * 0.97).toLocaleString('en-IN')}`;
        }

        const loggedInUser = localStorage.getItem('still_logged_in');
        if (loggedInUser === 'admin') loadAdminPanel();
        else if (loggedInUser) loadDashboard();
    </script>
</body>
</html>
