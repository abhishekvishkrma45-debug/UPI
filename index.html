<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Payment Gateway Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; }

    .header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    
    h3 { color: #333; margin-bottom: 20px; border-bottom: 2px solid #007bff; padding-bottom: 8px; font-size: 20px; }
    
    label { display: block; font-weight: bold; font-size: 14px; color: #555; margin-top: 15px; }
    input, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #007bff; }

    .btn-pay { width: 100%; margin-top: 25px; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-pay:hover { background: #218838; }

    .secure-badge { text-align: center; margin-top: 15px; font-size: 12px; color: #28a745; font-weight: bold; }
    
    #loading-spinner { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Akash Automatic Gateway</h1>
    <p>Instant Auto Verification & Wallet Top-up</p>
  </div>

  <div class="container">
    <h3>💳 Auto Payment Checkout</h3>

    <label>Mobile Number</label>
    <input type="number" id="user-mobile" placeholder="Enter 10 digit mobile number">

    <label>Select Service</label>
    <select id="service-type">
      <option value="Wallet Topup">Wallet Add Money</option>
      <option value="Jio Recharge">Jio Recharge</option>
      <option value="Airtel Recharge">Airtel Recharge</option>
      <option value="Google Play Code">Google Play Redeem Code</option>
    </select>

    <label>Enter Amount (₹)</label>
    <input type="number" id="pay-amount" placeholder="e.g. 100, 299, 500">

    <button class="btn-pay" onclick="startAutoPayment()">Pay & Verify Automatically</button>
    
    <div id="loading-spinner">⏳ Opening Secure Payment Gateway...</div>
    <div class="secure-badge">🔒 256-Bit SSL Encrypted Auto Gateway</div>
  </div>

  <script>
    // ---------------- CONFIGURATION ----------------
    const BOT_TOKEN = "7060236112:AAFSZSgRdoegdb4e_8FJ9s4h0BtGkgEwE1s";
    const CHAT_ID = "YOUR_CHAT_ID"; // Apni Telegram ID daalein
    
    // Aapke Paytm Business / UPI Gateway Merchant Details
    const PAYTM_MID = "YOUR_PAYTM_MERCHANT_ID"; 
    const UPI_ID = "YOUR_UPI_ID@paytm"; 
    // -----------------------------------------------

    function startAutoPayment() {
      const mobile = document.getElementById("user-mobile").value;
      const service = document.getElementById("service-type").value;
      const amount = document.getElementById("pay-amount").value;
      const spinner = document.getElementById("loading-spinner");

      if (CHAT_ID === "YOUR_CHAT_ID") {
        alert("Pehle code me JavaScript section ke andar CHAT_ID daalein!");
        return;
      }

      if (!mobile || mobile.length !== 10) {
        alert("Kripya sahi 10-digit mobile number bharein!");
        return;
      }

      if (!amount || amount < 1) {
        alert("Kripya valid amount bharein!");
        return;
      }

      spinner.style.display = "block";

      // Unique Order ID for Automatic Tracking
      const orderId = "ORD" + Date.now();

      // Deep-link UPI Payment URL for Instant Auto-checkout
      const upiPayUrl = `upi://pay?pa=${UPI_ID}&pn=AkashStore&tr=${orderId}&am=${amount}&cu=INR&tn=${encodeURIComponent(service)}`;

      // 1. Send Pending Order Notification to Telegram
      const initMsg = `🔄 *AUTOMATIC PAYMENT INITIATED*\n\n🆔 *Order ID:* \`${orderId}\`\n📱 *Mobile:* ${mobile}\n📌 *Service:* ${service}\n💵 *Amount:* ₹${amount}\n⏳ *Status:* Redirected to Gateway\n⏰ *Time:* ${new Date().toLocaleString()}`;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: initMsg, parse_mode: "Markdown" })
      }).then(() => {
        spinner.style.display = "none";
        
        // 2. Auto Redirect User to UPI Gateway / PhonePe / Paytm
        window.location.href = upiPayUrl;

        // Note: For full automatic server verification without manual UTR,
        // webhook needs to be connected to Node.js backend.
      }).catch(err => {
        spinner.style.display = "none";
        alert("Network Error! Try again.");
      });
    }
  </script>
</body>
</html>
